<!DOCTYPE html>
<html>
<head>
    <title>Login - Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
        }
        input, select {
            padding: 10px;
            margin: 10px 0;
            width: 250px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>🎮 Tic Tac Toe</h1>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Enter your name" required><br>
        <input type="email" name="email" placeholder="Enter your email" required><br>
        <select name="mode" required>
            <option value="human">Human vs Human</option>
            <option value="ai">Human vs AI</option>
        </select><br>
        <button type="submit">Start Game</button>
    </form>
</div>

</body>
</html>
