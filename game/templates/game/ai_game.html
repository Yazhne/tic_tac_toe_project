<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe vs AI</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            justify-content: center;
            margin-top: 50px;
        }
        .cell {
            width: 100px;
            height: 100px;
            font-size: 40px;
            cursor: pointer;
            border: 2px solid #333;
        }
        h1 {
            color: #333;
        }
        .winner {
            font-size: 24px;
            color: green;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>🎮 Tic Tac Toe vs AI</h1>
<div class="board">
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
</div>

<div class="winner" id="winner"></div>

<script>
    const cells = document.querySelectorAll('.cell');
    let gameOver = false;

    function checkWin() {
        const combos = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        for (let combo of combos) {
            const [a,b,c] = combo;
            if (cells[a].textContent &&
                cells[a].textContent === cells[b].textContent &&
                cells[a].textContent === cells[c].textContent) {
                document.getElementById('winner').textContent = cells[a].textContent + ' wins!';
                gameOver = true;
                return true;
            }
        }

        if ([...cells].every(cell => cell.textContent) && !gameOver) {
            document.getElementById('winner').textContent = "It's a draw!";
            gameOver = true;
            return true;
        }

        return false;
    }

    function aiMove() {
        let empty = [...cells].filter(cell => !cell.textContent);
        if (empty.length === 0) return;
        let choice = empty[Math.floor(Math.random() * empty.length)];
        choice.textContent = 'O';
        checkWin();
    }

    cells.forEach(cell => {
        cell.addEventListener('click', () => {
            if (!cell.textContent && !gameOver) {
                cell.textContent = 'X';
                if (!checkWin()) {
                    setTimeout(aiMove, 500); // AI moves after 0.5s
                }
            }
        });
    });
</script>

</body>
</html>
